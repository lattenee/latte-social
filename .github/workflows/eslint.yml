---
name: ESLint

on:
  push:
    branches:
      - main
      - master
    paths:
      - package.json
      - eslint.config.mjs
      - apps/**
      - '!apps/docs/**'
      - libraries/**

  pull_request:
    paths:
      - package.json
      - eslint.config.mjs
      - apps/**
      - '!apps/docs/**'
      - libraries/**

jobs:
  eslint:
    name: Run eslint scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install

      - name: Run ESLint
        env:
          # The repo pins eslint 8, which reads flat config only behind this
          # flag. Flat config does not accept --ext; the file globs live in
          # eslint.config.mjs. The SARIF formatter is a pinned devDependency,
          # so no runtime npm install is needed here.
          ESLINT_USE_FLAT_CONFIG: 'true'
        run: pnpm exec eslint apps libraries --format @microsoft/eslint-formatter-sarif --output-file eslint-results.sarif
        continue-on-error: true

      - name: Upload analysis results to GitHub
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: eslint-results.sarif
          wait-for-processing: true

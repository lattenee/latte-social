# latte-social — social.lattee.me
# Postiz stack (project `latte`) on Docker network `latte_postiz-network`.
# Nginx reaches it via Docker DNS (127.0.0.11) + variable proxy_pass.
# ACME HTTP-01: certbot webroot == certs dir.
server {
    listen 80;
    listen [::]:80;
    server_name social.lattee.me;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /.well-known/acme-challenge/ {
        root /etc/nginx/certs;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name social.lattee.me;

    ssl_certificate     /etc/nginx/certs/live/social.lattee.me/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/live/social.lattee.me/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 500m;
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $latte_upstream postiz:5000;
        proxy_pass http://$latte_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }
}
